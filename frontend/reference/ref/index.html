<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>E-Commerce Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Font Awesome CDN (REQUIRED for icons) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- ✅ External CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- LEFT -->
      <div class="left">
        <h1>Fast<br />Friendly<br />Trusted Marketplace.</h1>
        <p>A user-friendly platform for smart deals and real value.</p>

        <div class="illustration">
          <img src="ecom.png" alt="illustration" />
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="welcome">
          <h2>Welcome Back</h2>
          <p class="subtitle">Please login to your account</p>
        </div>
        <form>
          <input type="email" placeholder="Email address" required />
          <input type="password" placeholder="Password" required />

          <div class="forgot">
            <a href="#">Forgot Password?</a>
          </div>

          <button class="login-btn">Login</button>
        </form>

        <div class="divider">Or Login With</div>

        <div class="social-buttons">
          <button class="google">
            <i class="fa-brands fa-google"></i> Google
          </button>

          <button class="facebook">
            <i class="fa-brands fa-facebook-f"></i> Facebook
          </button>
        </div>

        <p class="signup">Don’t have an account? <a href="#">Signup</a></p>
      </div>
    </div>
  </body>
</html>
