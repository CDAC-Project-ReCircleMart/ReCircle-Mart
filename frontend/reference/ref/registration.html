<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - DN Spurt</title>
    <link rel="stylesheet" href="registration.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background">
      <div class="form-container">
        <h2>Create Your Account</h2>
        <p class="subtitle">Join the fastest growing marketplace today!</p>
        <form>
          <input type="text" placeholder="Full Name" required />
          <input type="email" placeholder="Email ID" required />
          <input
            type="tel"
            placeholder="Mobile Number (OTP verification)"
            required
          />
          <input type="password" placeholder="Password" required />
          <input type="password" placeholder="Confirm Password" required />
          <button type="submit">Sign Up</button>
        </form>
        <p class="signup-text">
          Already have an account? <a href="#">Login</a>
        </p>
      </div>
    </div>
  </body>
</html>
