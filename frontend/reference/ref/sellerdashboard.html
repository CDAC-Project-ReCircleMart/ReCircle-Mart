<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Post Your Ad</title>
    <link rel="stylesheet" href="selleredashboard.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="page-title">POST YOUR AD</h1>

      <!-- Include details -->
      <section class="card">
        <h3>INCLUDE SOME DETAILS</h3>

        <label>Brand</label>
        <input type="text" />

        <label>Year</label>
        <input type="text" />

        <label>Fuel Type</label>
        <div class="btn-group">
          <button>CNG & HYBRID</button>
          <button>DIESEL</button>
          <button>PETROL</button>
          <button>ELECTRIC</button>
        </div>

        <label>Transmission</label>
        <div class="btn-group">
          <button>AUTOMATIC</button>
          <button>MANUAL</button>
        </div>

        <label>KM Driven</label>
        <input type="text" />

        <label>No of Owners</label>
        <div class="btn-group">
          <button>1st</button>
          <button>2nd</button>
          <button>3rd</button>
          <button>4th</button>
          <button>4+</button>
        </div>

        <label>Add Title</label>
        <input type="text" />

        <label>Description</label>
        <textarea rows="4"></textarea>
      </section>

      <!-- Price -->
      <section class="card">
        <h3>SET PRICE</h3>
        <input type="text" placeholder="₹" />
      </section>

      <!-- Upload photos -->
      <section class="card">
        <h3>UPLOAD PHOTOS</h3>
        <div class="photo-grid">
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
          <div class="photo-box">+</div>
        </div>
      </section>

      <!-- Location -->
      <section class="card">
        <h3>CONFIRM YOUR LOCATION</h3>
        <label>State</label>
        <select>
          <option>Select State</option>
          <option>Maharashtra</option>
          <option>Gujarat</option>
          <option>Karnataka</option>
        </select>
      </section>

      <!-- Review -->
      <section class="card">
        <h3>REVIEW YOUR DETAILS</h3>

        <label>Name</label>
        <input type="text" maxlength="30" />

        <p class="verify-text">
          Lets verify your account<br />
          <small>We will send you a confirmation code</small>
        </p>

        <label>Mobile phone number</label>
        <input type="text" value="+91" />
      </section>

      <button class="post-btn">POST NOW</button>
    </div>
  </body>
</html>
