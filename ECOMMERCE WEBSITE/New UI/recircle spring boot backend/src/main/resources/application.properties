# =========================
# Application
# =========================
spring.application.name=recirclemart-backend
server.port=8080


# =========================
# Database (MySQL)
# =========================
spring.datasource.url=jdbc:mysql://localhost:3306/recirclemart?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


# =========================
# JWT Configuration (must match frontend behavior)
# =========================
jwt.token.secret=ksfsndlkfh4itwhlksfnlkejrlfsijelf
jwt.token.expiration.millis=36000000


# =========================
# File Upload (Multer replacement)
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Folder where images will be stored (same as Node /uploads)
file.upload-dir=src/main/resources/static/uploads


# =========================
# Static Resource Mapping (to serve images)
# =========================
spring.web.resources.static-locations=classpath:/static/


# =========================
# Logging (optional, useful for debugging)
# =========================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
